server {
    listen 80;
    server_name _;

    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location /downloads/ {
        alias /downloads/;
        autoindex off;
        add_header Accept-Ranges bytes;
        sendfile on;
    }
}
